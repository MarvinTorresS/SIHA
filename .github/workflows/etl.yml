name: ETL Banner + Malla (automatizado)

# Corre a diario todo el año. Ya no hay guard de meses: run_etl.py descubre
# solo los períodos con secciones Coto en Banner y la regla de 0 secciones
# evita que un Banner vacío marque secciones 'agotada' o apague períodos.
#
# workflow_dispatch permite dispararlo a mano desde la pestaña Actions:
# - ciclos: fuerza períodos puntuales (ej. "202620,202695"), sin
#   descubrimiento. Igual respeta "(View Only)".
# - solo_verificar_bd: solo prueba la conexión a la BD y lista los
#   períodos, sin pegarle a Banner ni escribir nada. No notifica.
# - probar_telegram: manda "SIHA ETL: notificaciones OK" y termina, sin
#   correr el ETL ni tocar la BD (job probar-telegram).
#
# Avisos (notify_telegram.py, en un paso aparte que corre siempre): fallo o
# fallo parcial -> mensaje con link a la corrida; cambios -> resumen; lunes
# sin cambios -> latido; corrida manual sin cambios -> "sin cambios". Si el
# envío falla, falla ese paso y no el del ETL.
on:
  schedule:
    # 12:00 UTC = 06:00 hora Costa Rica (UTC-6)
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      ciclos:
        description: "Períodos a forzar, separados por coma (vacío = descubrir solo)"
        type: string
        default: ""
      solo_verificar_bd:
        description: "Solo verificar la conexión a la BD (python run_etl.py --check-db)"
        type: boolean
        default: false
      probar_telegram:
        description: "Solo mandar un mensaje de prueba a Telegram (no corre el ETL)"
        type: boolean
        default: false

jobs:
  # GitHub desactiva los workflows programados tras 60 días sin actividad
  # en el repo (temporada baja de SIHA). Re-habilitarlo a diario desde el
  # mismo cron evita que el ETL se apague solo.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Mantener el workflow habilitado
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/etl.yml/enable"

  # Prueba del canal: sin secrets de la BD en el entorno y sin pip install
  # (notify_telegram.py usa solo la biblioteca estándar).
  probar-telegram:
    if: ${{ github.event.inputs.probar_telegram == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: data-extractor
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Mensaje de prueba
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 notify_telegram.py --test

  etl:
    if: ${{ github.event.inputs.probar_telegram != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: data-extractor
    env:
      DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
      DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
      DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
      DATABASE_USER: ${{ secrets.DATABASE_USER }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar conexión a la BD (solo_verificar_bd)
        if: ${{ github.event.inputs.solo_verificar_bd == 'true' }}
        run: python run_etl.py --check-db

      # run_etl.py genera syllabi_normalized.json (excel_loader) antes de
      # extraer: no está en git y sin él banner_connector no puede correr.
      # Antes de Banner hace el mismo chequeo de conexión que --check-db.
      # El timeout va en el PASO, no en el job: si se corta, el paso
      # Notificar (if: always()) igual corre y avisa que no hay resumen.
      - name: Ejecutar ETL
        if: ${{ github.event.inputs.solo_verificar_bd != 'true' }}
        timeout-minutes: 60
        env:
          CICLOS: ${{ github.event.inputs.ciclos }}
        run: python run_etl.py

      - name: Subir logs (si falló)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: etl-logs
          path: data-extractor/logs/
          retention-days: 14

      # Paso aparte: si falla el envío, este paso queda rojo y el del ETL
      # sigue verde. Lee output/run_summary.json; si no existe, avisa que
      # el ETL murió antes de generarlo. Escribe en $GITHUB_STEP_SUMMARY.
      - name: Notificar (Telegram)
        if: ${{ always() && github.event.inputs.solo_verificar_bd != 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 notify_telegram.py --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
